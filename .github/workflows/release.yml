name: Release

# Pushing a tag such as v0.1.0 builds the .deb and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-yaml python3-pytest lintian
      - name: Check the tag matches __version__ and debian/changelog
        run: scripts/check-release.sh "$GITHUB_REF_NAME" release-notes.md
      - run: scripts/build-deb.sh
      - name: Create the GitHub release with the .deb attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/seedcheck_*_all.deb
          --verify-tag
          --title "Seedcheck $GITHUB_REF_NAME"
          --notes-file release-notes.md
